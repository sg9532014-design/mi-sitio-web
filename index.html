<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReparaTodo - El Pinterest de las Reparaciones</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0f19; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #e11d48; margin-bottom: 5px; font-size: 2.5rem; text-align: center; }
        .subtitulo { color: #9ca3af; margin-bottom: 30px; text-align: center; }
        .feed-pinterest { max-width: 450px; width: 100%; background: #1f2937; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); border: 1px solid #374151; }
        .video-container { width: 100%; background: #000; position: relative; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; }
        .candado-premium { position: absolute; background: rgba(0,0,0,0.85); width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; box-sizing: border-box; }
        .btn-pagar { background: #e11d48; color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .contenido-tarjeta { padding: 20px; }
        h2 { margin: 0 0 10px 0; font-size: 1.4rem; color: #f3f4f6; }
        .afiliados-seccion { margin-top: 20px; border-top: 1px solid #374151; padding-top: 15px; }
        .afiliados-seccion h3 { font-size: 1rem; color: #f59e0b; margin: 0 0 10px 0; }
        .lista-materiales { list-style: none; padding: 0; margin: 0; }
        .lista-materiales li { margin-bottom: 8px; }
        .enlace-amazon { display: inline-block; width: 100%; background: #232f3e; color: #ff9900; text-decoration: none; padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; font-weight: bold; text-align: center; border: 1px solid #ff9900; box-sizing: border-box; }
    </style>
</head>
<body>

    <h1>🛠️ ReparaTodo</h1>
    <p class="subtitulo">Aprende a repararlo tú mismo y consigue los materiales al instante.</p>

    <div class="feed-pinterest">
        <div class="video-container" id="contenedor-video"></div>
        <div class="contenido-tarjeta">
            <h2 id="guia-titulo">Cargando guía...</h2>
            <div class="afiliados-seccion">
                <h3>🛠️ Materiales y Herramientas Necesarias:</h3>
                <ul class="lista-materiales" id="lista-materiales"></ul>
            </div>
        </div>
    </div>

    <script>
        fetch('/api/guias/reparar-abanico')
            .then(res => {
                if (!res.ok) throw new Error('Error en el servidor');
                return res.json();
            })
            .then(data => {
                document.getElementById('guia-titulo').innerText = data.titulo;

                const contenedorVideo = document.getElementById('contenedor-video');
                contenedorVideo.innerHTML = `
                    <div class="candado-premium">
                        <span style="font-size: 2rem;">🔒</span>
                        <p style="margin: 5px 0; font-size: 0.9rem; font-weight: bold;">${data.mensaje}</p>
                        <button class="btn-pagar" id="boton-checkout">Desbloquear por $5.00 USD</button>
                    </div>
                `;

                document.getElementById('boton-checkout').addEventListener('click', () => {
                    fetch('/api/crear-sesion-pago', { method: 'POST' })
                        .then(res => res.json())
                        .then(sesion => { window.location.href = sesion.url; })
                        .catch(err => alert('Error al procesar el pago.'));
                });

                const listaHTML = document.getElementById('lista-materiales');
                listaHTML.innerHTML = '';
                data.materialesAfiliado.forEach(material => {
                    listaHTML.innerHTML += `
                        <li>
                            <a href="${material.enlace}" target="_blank" class="enlace-amazon">
                                🛒 Comprar ${material.nombre} en Amazon
                            </a>
                        </li>
                    `;
                });
            })
            .catch(err => {
                document.getElementById('guia-titulo').innerText = "⚠️ Error al conectar con el servidor";
                console.error(err);
            });
    </script>
</body>
</html>
